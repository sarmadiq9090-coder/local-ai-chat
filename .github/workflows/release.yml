name: Release

# A release happens when a push to main changes the Cargo.toml version: the
# `version` job sees that tag `v<version>` does not exist yet, and the run builds,
# signs and publishes a GitHub Release with
#   local-ai-chat.exe          the new exe
#   local-ai-chat.exe.sha256   "<hex>  local-ai-chat.exe" (2.2.0 and older clients require it)
#   local-ai-chat.exe.minisig  minisign signature, trusted comment "local-ai-chat <tag>"
# plus a GitHub build-provenance attestation. Specs: docs/specs/auto-update.md,
# docs/specs/signing.md (threat model, keys, owner setup).
#
# So releasing = merging a PR that bumps `version` in Cargo.toml. The tag is made
# by `publish` (`gh release create v<version> --target <sha>`, as a draft, then
# published). A tag created with the workflow's GITHUB_TOKEN does not start
# another run. Pushing a `v<Cargo.toml version>` tag by hand still works too.
# A push to main with an unchanged version only runs the quick `version` job.
#
# Jobs:
#   version  ubuntu, read-only, no checkout: reads Cargo.toml at this commit and
#            asks the API whether tag `v<version>` exists. Outputs new=true when
#            this run must release (main push with a new version, or a tag push).
#   build    windows, read-only token, no secrets, no cache: test + build the exe.
#   sign     bound to the `release` Environment (owner approval; allowed refs:
#            branch main + v* tags; holds MINISIGN_SECRET_KEY / MINISIGN_PASSWORD).
#            Runs NO repository code: downloads the build artifact, installs a
#            pinned + checksummed minisign, signs, and verifies against the
#            committed public keys.
#   publish  contents/attestations write: attests, creates a DRAFT release with the
#            3 assets (and the tag, at this commit), checks they are all there,
#            then publishes it.
#   dry-run  (manual "Run workflow" only) signs with a throwaway key made in the
#            job and verifies it with minisign AND the app's Rust verifier. No
#            secrets, no release.
#
# Every `uses:` is pinned to a full commit SHA (Dependabot keeps them current).

on:
  push:
    branches: [main] # releases when the Cargo.toml version is new
    tags: ["v*"]     # manual tag push, kept for backward compatibility
  workflow_dispatch: # dry run: build + throwaway-key signing, never releases

permissions:
  contents: read

# One release run at a time, never cancelled half-way (e.g. while waiting for
# approval). Queued runs re-check the tag when they start.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # minisign 0.12 release archives (github.com/jedisct1/minisign), verified with the
  # author's key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3.
  MINISIGN_LINUX_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
  MINISIGN_LINUX_SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
  MINISIGN_WIN64_URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
  MINISIGN_WIN64_SHA256: 37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Read the Cargo.toml version and check whether its tag exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/Cargo.toml?ref=${GITHUB_SHA}" |
            grep -m1 '^version' | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ -z "${version}" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          tag="v${version}"
          new=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Manual tag push: release that tag, which must match Cargo.toml.
            if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
              exit 1
            fi
            new=true
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Push to main: release only if tag v<version> does not exist yet.
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .ref 2>&1); then
              echo "Tag ${tag} already exists: nothing to release."
            elif printf '%s' "${out}" | grep -q 'HTTP 404'; then
              echo "Tag ${tag} does not exist yet: releasing ${tag} from ${GITHUB_SHA}."
              new=true
            else
              echo "::error::Could not check whether tag ${tag} exists: ${out}"
              exit 1
            fi
          fi
          if [ "${new}" = "true" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # The signature's trusted comment is "local-ai-chat <tag>" and the app
            # expects "local-ai-chat v<normalized version>": no leading zeros, no +build.
            if ! printf '%s' "${tag}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::Tag ${tag} must look like vMAJOR.MINOR.PATCH[-pre] (no leading zeros, no +build)"
              exit 1
            fi
          fi
          {
            echo "new=${new}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the annotated tag message is available.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch annotated tag object
        if: github.ref_type == 'tag'
        shell: bash
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Prepare assets
        shell: bash
        run: |
          mkdir dist
          cp target/release/local-ai-chat.exe dist/
          cd dist
          # Format: "<hex>  local-ai-chat.exe" (sha256sum style, lower-case hex)
          sha256sum local-ai-chat.exe > local-ai-chat.exe.sha256
          cat local-ai-chat.exe.sha256

      - name: Release notes from tag message
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # Annotated tag message -> release body. Left empty for lightweight tags or
          # if the message is just the tag name (publish then generates notes).
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" ]; then
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > dist/notes.md
          else
            : > dist/notes.md
          fi
          if [ "$(tr -d '[:space:]' < dist/notes.md)" = "${GITHUB_REF_NAME}" ]; then
            : > dist/notes.md
          fi

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'branch' && github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The "## [<version>]" section of CHANGELOG.md, up to the next "## ".
          # Left empty if there is none (publish then generates notes).
          awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          if [ -z "$(tr -d '[:space:]' < dist/notes.md)" ]; then
            : > dist/notes.md
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [version, build]
    if: needs.version.outputs.new == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Owner approval + `v*` deployment-tag rule + the signing secrets live here.
    environment: release
    permissions:
      contents: read # read the committed public keys through the API
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Check the artifact's checksum
        working-directory: dist
        run: sha256sum -c local-ai-chat.exe.sha256

      - name: Install minisign (pinned, checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o minisign.tar.gz "$MINISIGN_LINUX_URL"
          echo "${MINISIGN_LINUX_SHA256}  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - name: Fetch the committed public keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pub"
          for k in primary backup; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/keys/minisign-${k}.pub?ref=${GITHUB_SHA}" \
              > "$RUNNER_TEMP/pub/${k}.pub" || rm -f "$RUNNER_TEMP/pub/${k}.pub"
          done
          if ! ls "$RUNNER_TEMP"/pub/*.pub >/dev/null 2>&1; then
            echo "::error::No keys/minisign-primary.pub or keys/minisign-backup.pub in the repo. Set up signing first: docs/specs/signing.md"
            exit 1
          fi

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::The release Environment has no MINISIGN_SECRET_KEY secret. Set up signing first: docs/specs/signing.md"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "$key"
          printf '%s\n' "${MINISIGN_PASSWORD}" |
            minisign -S -s "$key" -m dist/local-ai-chat.exe -t "local-ai-chat ${TAG}"

      - name: Verify the signature against the committed public keys
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          expected="local-ai-chat ${TAG}"
          for pub in "$RUNNER_TEMP"/pub/*.pub; do
            if minisign -Vm dist/local-ai-chat.exe -p "$pub"; then
              comment=$(minisign -V -Q -m dist/local-ai-chat.exe -p "$pub")
              if [ "$comment" = "$expected" ]; then
                echo "Verified with $(basename "$pub"): $comment"
                exit 0
              fi
              echo "::error::Trusted comment is '$comment', expected '$expected'"
              exit 1
            fi
          done
          echo "::error::The signature does not verify with any committed public key (wrong MINISIGN_SECRET_KEY?)"
          exit 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sig
          path: dist/local-ai-chat.exe.minisig
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build, sign]
    if: needs.version.outputs.new == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # attestation (Sigstore OIDC)
      attestations: write # attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check the assets
        working-directory: dist
        run: |
          sha256sum -c local-ai-chat.exe.sha256
          for f in local-ai-chat.exe local-ai-chat.exe.sha256 local-ai-chat.exe.minisig; do
            [ -s "$f" ] || { echo "::error::missing $f"; exit 1; }
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/local-ai-chat.exe

      - name: Remove stale drafts of this tag (from an earlier failed run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id" |
            while read -r id; do
              echo "Deleting stale draft release ${id}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            done

      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --draft --title "$TAG")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            args+=(--verify-tag)
          else
            # The tag is created at this exact commit when the draft is published.
            args+=(--target "$GITHUB_SHA")
          fi
          if [ -s dist/notes.md ]; then
            args+=(--notes-file dist/notes.md)
          else
            args+=(--generate-notes)
          fi
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" "${args[@]}" \
            dist/local-ai-chat.exe dist/local-ai-chat.exe.sha256 dist/local-ai-chat.exe.minisig

      - name: Check all 3 assets are on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[] | select(.size > 0) | .name] | sort | join(",")')
          expected="local-ai-chat.exe,local-ai-chat.exe.minisig,local-ai-chat.exe.sha256"
          if [ "$names" != "$expected" ]; then
            echo "::error::Draft assets are '$names', expected '$expected'. The draft was left unpublished."
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Check the tag points at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '[.object.type, .object.sha] | join(" ")')
          sha=${ref#* }
          if [ "${ref%% *}" = "tag" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${TAG} points at ${sha}, expected ${GITHUB_SHA}"
            exit 1
          fi
          echo "Released ${TAG} at ${sha}"

  dry-run:
    needs: [version, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Install minisign (pinned, checksum-verified)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "minisign.zip"
          Invoke-WebRequest -Uri $env:MINISIGN_WIN64_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MINISIGN_WIN64_SHA256) { throw "minisign checksum mismatch: $hash" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "minisign")
          Join-Path $env:RUNNER_TEMP "minisign\minisign-win64\x86_64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Sign with a throwaway key and verify with minisign
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          minisign -G -W -p "$RUNNER_TEMP/throwaway.pub" -s "$RUNNER_TEMP/throwaway.key"
          minisign -S -s "$RUNNER_TEMP/throwaway.key" -m dist/local-ai-chat.exe -t "local-ai-chat ${TAG}"
          minisign -Vm dist/local-ai-chat.exe -p "$RUNNER_TEMP/throwaway.pub"
          comment=$(minisign -V -Q -m dist/local-ai-chat.exe -p "$RUNNER_TEMP/throwaway.pub")
          [ "$comment" = "local-ai-chat ${TAG}" ] || { echo "::error::trusted comment '$comment'"; exit 1; }

      - name: Verify with the app's Rust verifier
        shell: bash
        env:
          LEMON_DRYRUN_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Native Windows paths for the test binary (Git Bash's $PWD is /d/a/...).
          here=$(pwd -W)
          tmp=$(cygpath -m "$RUNNER_TEMP")
          export LEMON_DRYRUN_FILE="$here/dist/local-ai-chat.exe"
          export LEMON_DRYRUN_SIG="$here/dist/local-ai-chat.exe.minisig"
          export LEMON_DRYRUN_PUB="$tmp/throwaway.pub"
          cargo test --locked ci_dry_run_signature -- --ignored --nocapture
