name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  notices:
    name: third-party notices up to date
    # Cross-platform: reads Cargo.lock for x86_64-pc-windows-msvc via cargo metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check THIRD-PARTY-NOTICES.txt (and that every licence is allowed)
        run: python3 tools/make_notices.py --check

  build:
    name: test + release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check the exe imports only Windows system DLLs (no Visual C++ runtime)
        run: python tools/check_imports.py target/release/local-ai-chat.exe
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-chat-${{ github.sha }}
          path: |
            target/release/local-ai-chat.exe
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
