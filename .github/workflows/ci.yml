name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets -- -D warnings

  notices:
    name: third-party notices up to date
    # Cross-platform: reads Cargo.lock for x86_64-pc-windows-msvc via cargo metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - name: Check THIRD-PARTY-NOTICES.txt (and that every licence is allowed)
        run: python3 tools/make_notices.py --check

  cargo-deny:
    name: cargo-deny (licences, bans, sources, advisories)
    # deny.toml limits the graph to the Windows MSVC targets, without dev-dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories

  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit .github/workflows
        run: pipx run --spec zizmor==1.32.0 zizmor --offline --min-severity low .github/workflows

  i18n:
    name: ar/en string parity (ui/**/strings.js)
    # tests/i18n_parity.rs: same keys in ar and en, no empty values, same {placeholders}.
    # Also part of `cargo test` in the build job; this job reports it on its own.
    # The test uses only std, so it is compiled alone with rustc (building the crate
    # on Linux would need the GTK/WebKit dev packages).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - name: Build and run tests/i18n_parity.rs
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --edition 2024 --test tests/i18n_parity.rs -o "$RUNNER_TEMP/i18n_parity"
          "$RUNNER_TEMP/i18n_parity"

  build:
    name: test + release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check the exe imports only Windows system DLLs (no Visual C++ runtime)
        run: python tools/check_imports.py target/release/local-ai-chat.exe
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-ai-chat-${{ github.sha }}
          path: |
            target/release/local-ai-chat.exe
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
